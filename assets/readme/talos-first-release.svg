<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1408" viewBox="0 0 800 704" role="img" aria-labelledby="title desc"><title id="title">TALOS 首版范围与长期方向</title><desc id="desc">用户资料进入共同基础，支持资料变成果、目标变交付、重复工作自动化三类建设目标。用户选择AI参与程度。长期方向尚未实现。</desc><g font-family="Inter, Noto Sans CJK SC, system-ui, sans-serif, Arial Unicode MS"><rect width="800" height="704" fill="#F5F5F7"/><text x="48" y="56" font-size="14" font-weight="500" fill="#63666D">TALOS / FIRST RELEASE SCOPE</text><text x="48" y="112" font-size="36" font-weight="500" fill="#17191F">从已有资料，到可用成果</text><path d="M48 148H72L64 140M72 148L64 156" stroke="#17191F" stroke-width="2" fill="none"/><text x="88" y="154" font-size="18" font-weight="400" fill="#17191F">已确认的首版建设范围 · 完整流程仍待真实验证</text><path d="M48 184H752" stroke="#D6D9DF" fill="none"/><text x="48" y="220" font-size="24" font-weight="500" fill="#17191F">01  从你的资料开始</text><text x="48" y="252" font-size="18" font-weight="400" fill="#17191F">Obsidian 笔记库为主，本地文件夹辅助。</text><text x="48" y="280" font-size="16" font-weight="400" fill="#63666D">前期借鉴超级大脑的真实使用经验；部署包与插件作为实现母版。</text><path d="M48 304H752" stroke="#D6D9DF" fill="none"/><text x="48" y="340" font-size="24" font-weight="500" fill="#17191F">02  配好共同基础</text><text x="48" y="372" font-size="18" font-weight="400" fill="#17191F">规范、模板、学习与场景方案包 + Obsidian 插件</text><text x="48" y="400" font-size="16" font-weight="400" fill="#63666D">用户选择模型与 AI 参与程度，关键决定由人确认。</text><path d="M48 424H752" stroke="#D6D9DF" fill="none"/><text x="48" y="460" font-size="24" font-weight="500" fill="#17191F">03  打通三类工作流程</text><path d="M48 492H232" stroke="#76B0FA" stroke-width="4"/><text x="48" y="528" font-size="20" font-weight="500" fill="#17191F">资料变成果</text><text x="48" y="560" font-size="16" font-weight="400" fill="#63666D">报告、方案或内容</text><path d="M296 492H480" stroke="#76B0FA" stroke-width="4"/><text x="296" y="528" font-size="20" font-weight="500" fill="#17191F">目标变交付</text><text x="296" y="560" font-size="16" font-weight="400" fill="#63666D">可检查、可接续的成果</text><path d="M544 492H728" stroke="#76B0FA" stroke-width="4"/><text x="544" y="528" font-size="20" font-weight="500" fill="#17191F">重复工作自动化</text><text x="544" y="560" font-size="16" font-weight="400" fill="#63666D">复用流程，由人检查</text><path d="M48 592H752" stroke="#D6D9DF" fill="none"/><circle cx="56" cy="624" r="8" fill="none" stroke="#17191F" stroke-width="2"/><text x="80" y="630" font-size="18" font-weight="500" fill="#17191F">长期方向</text><text x="184" y="630" font-size="18" font-weight="400" fill="#17191F">团队协作 · 模型订阅接入 · TALOS World</text><text x="48" y="672" font-size="16" font-weight="400" fill="#63666D">首阶段：macOS · 单用户 · 单设备本地使用</text></g></svg>
